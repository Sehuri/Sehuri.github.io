name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build:pages

      - name: Publish gh-pages branch
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin gh-pages
          git worktree add --detach "$RUNNER_TEMP/gh-pages" origin/gh-pages

          rsync -a --delete --exclude=.git out/ "$RUNNER_TEMP/gh-pages/"
          touch "$RUNNER_TEMP/gh-pages/.nojekyll"

          cd "$RUNNER_TEMP/gh-pages"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No generated changes to publish."
            exit 0
          fi

          git commit -m "deploy: ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages
